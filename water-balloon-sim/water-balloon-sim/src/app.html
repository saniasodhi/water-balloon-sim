<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water balloon ballistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(24,28,33,.78);
  --panel-solid:#1b1f24;
  --ink:#e9edf0;
  --muted:#96a2ab;
  --line:rgba(233,237,240,.12);
  --brass:#caa45a;
  --brass-ink:#1c1609;
  --track:rgba(233,237,240,.18);
  --stage:#07080a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --panel: rgba(236,238,240,.86);
    --panel-solid:#eceef0;
    --ink:#1b2126;
    --muted:#56626b;
    --line:rgba(27,33,38,.14);
    --brass:#8f6a22;
    --brass-ink:#fffaf0;
    --track:rgba(27,33,38,.2);
  }
}
:root[data-theme="dark"]{
  --panel: rgba(24,28,33,.78); --panel-solid:#1b1f24; --ink:#e9edf0; --muted:#96a2ab; --line:rgba(233,237,240,.12);
  --brass:#caa45a; --brass-ink:#1c1609; --track:rgba(233,237,240,.18);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;background:var(--stage);color:var(--ink);font-family:"Chivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;overflow:hidden}
.app{position:relative;height:100%;display:grid;grid-template-columns:1fr 316px}
.stage{position:relative;min-width:0;min-height:0;touch-action:none;background:#050607}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#view.dragging{cursor:grabbing}
.title{position:absolute;left:22px;top:18px;pointer-events:none;max-width:min(560px,70%)}
.title h1{margin:0;font-weight:300;font-size:26px;letter-spacing:-.01em;line-height:1.1;color:#f1f3f4;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.clock{margin-top:8px;display:flex;gap:18px;align-items:baseline;font-variant-numeric:tabular-nums;color:#f1f3f4;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.clock .t{font-size:40px;font-weight:800;letter-spacing:-.02em}
.clock .t small{font-size:17px;font-weight:400;margin-left:4px;color:#c9d0d5}
.clock .rate{font-size:14px;color:#c9d0d5}
.phase{margin-top:2px;font-size:14px;color:#c9d0d5;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.transport{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;height:36px;min-width:36px;padding:0 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:600;min-width:86px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn svg{width:16px;height:16px;fill:currentColor}
.scrub{flex:1;min-width:80px;display:flex;flex-direction:column;gap:2px}
.scrub .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--track);border-radius:3px}
input[type=range]::-moz-range-track{height:3px;background:var(--track);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--brass);margin-top:-6px;border:2px solid var(--panel-solid)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--brass);border:2px solid var(--panel-solid)}
.panel{background:var(--panel-solid);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px}
.panel h2{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 6px;letter-spacing:.01em}
.panel h2:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;margin:8px 0 2px}
.row label{font-size:14px}
.row output{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1 / -1}
.swatches{display:flex;gap:8px;margin:10px 0 4px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),inset 0 4px 8px rgba(255,255,255,.25)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0 2px;cursor:pointer}
.check input{accent-color:var(--brass);width:16px;height:16px}
.hint{font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:14px}
.settings-toggle{display:none}
.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:#e9edf0}
.busy{position:absolute;right:18px;top:18px;font-size:13px;color:#d6dcdf;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:8px;display:none}
@media (max-width: 820px){
  .app{grid-template-columns:1fr}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:62%;z-index:5;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s ease;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .panel.open{transform:none}
  .settings-toggle{display:inline-flex}
  .title h1{font-size:19px}
  .clock .t{font-size:30px}
  .transport{flex-wrap:wrap;left:8px;right:8px;bottom:8px}
  .scrub{order:5;flex-basis:100%}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){ .panel{transition:none} }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="view" aria-label="3D view of the simulation. Drag to orbit, scroll to zoom, right-drag to pan."></canvas>
    <div class="title">
      <h1 id="headline">Water balloon, 9 mm round at 360 m/s</h1>
      <div class="clock"><span class="t" id="clock">−0.37<small>ms</small></span><span class="rate" id="rate">2 400× slower</span></div>
      <div class="phase" id="phase">Bullet approaching</div>
    </div>
    <div class="busy" id="busy">Simulating…</div>
    <div class="transport">
      <button class="btn primary" id="play" aria-label="Pause"><svg viewBox="0 0 16 16" id="playIcon"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg><span id="playText">Pause</span></button>
      <button class="btn" id="step" title="Step forward one frame (→)" aria-label="Step forward"><svg viewBox="0 0 16 16"><path d="M3 2l8 6-8 6z"/><rect x="12" y="2" width="2" height="12"/></svg></button>
      <button class="btn" id="restart" title="Restart (R)" aria-label="Restart"><svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.7.6A3.7 3.7 0 1 0 8 4.3V6.5L4.5 3.5 8 0.5z"/></svg></button>
      <div class="scrub">
        <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Timeline">
        <div class="ticks"><span>shot</span><span id="tEndLabel">0.9 s</span></div>
      </div>
      <button class="btn settings-toggle" id="settingsBtn" aria-expanded="false" aria-controls="panel">Settings</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <aside class="panel" id="panel" aria-label="Simulation settings">
    <h2>Shot</h2>
    <div class="row"><label for="speed">Bullet speed</label><output id="speedO"></output><input type="range" id="speed" min="120" max="1000" step="10" value="360"></div>
    <div class="row"><label for="caliber">Caliber</label><output id="caliberO"></output><input type="range" id="caliber" min="4.5" max="12.7" step="0.1" value="9"></div>
    <div class="row"><label for="offset">Impact height</label><output id="offsetO"></output><input type="range" id="offset" min="-0.7" max="0.7" step="0.05" value="0"></div>
    <div class="row"><label for="energy">Drag in water</label><output id="energyO"></output><input type="range" id="energy" min="0.1" max="2" step="0.05" value="1"></div>

    <h2>Balloon</h2>
    <div class="row"><label for="radius">Diameter</label><output id="radiusO"></output><input type="range" id="radius" min="0.05" max="0.14" step="0.005" value="0.08"></div>
    <div class="row"><label for="height">Hanging height</label><output id="heightO"></output><input type="range" id="height" min="0.4" max="2" step="0.05" value="1"></div>
    <div class="row"><label for="snap">Rubber snap speed</label><output id="snapO"></output><input type="range" id="snap" min="6" max="80" step="1" value="30"></div>
    <div class="swatches" role="group" aria-label="Balloon color" id="swatches"></div>

    <h2>Physics</h2>
    <div class="row"><label for="gravity">Gravity</label><output id="gravityO"></output><input type="range" id="gravity" min="0" max="25" step="0.01" value="9.81"></div>
    <div class="row"><label for="cavity">Cavity collapse</label><output id="cavityO"></output><input type="range" id="cavity" min="0" max="1" step="0.05" value="0.5"></div>
    <div class="row"><label for="mist">Spray and mist</label><output id="mistO"></output><input type="range" id="mist" min="0" max="2" step="0.05" value="1"></div>
    <div class="row"><label for="count">Water particles</label><output id="countO"></output><input type="range" id="count" min="1500" max="12000" step="100" value="6000"></div>

    <h2>Light and camera</h2>
    <div class="row"><label for="laz">Light direction</label><output id="lazO"></output><input type="range" id="laz" min="-180" max="180" step="1" value="-55"></div>
    <div class="row"><label for="lel">Light height</label><output id="lelO"></output><input type="range" id="lel" min="5" max="85" step="1" value="38"></div>
    <div class="row"><label for="lint">Light intensity</label><output id="lintO"></output><input type="range" id="lint" min="0.2" max="3" step="0.05" value="1"></div>
    <div class="row"><label for="expo">Exposure</label><output id="expoO"></output><input type="range" id="expo" min="0.3" max="3" step="0.05" value="1.1"></div>
    <div class="row"><label for="scale">Render resolution</label><output id="scaleO"></output><input type="range" id="scale" min="0.3" max="1" step="0.05" value="0.7"></div>
    <div class="views">
      <button class="btn" data-view="side">Side</button>
      <button class="btn" data-view="barrel">Down the barrel</button>
      <button class="btn" data-view="above">Above</button>
      <button class="btn" data-view="floor">Floor</button>
    </div>
    <label class="check"><input type="checkbox" id="follow" checked> Follow the water</label>

    <h2>Playback</h2>
    <div class="row"><label for="slow">Slow motion at impact</label><output id="slowO"></output><input type="range" id="slow" min="1.3" max="4.3" step="0.05" value="3.38"></div>
    <label class="check"><input type="checkbox" id="ramp" checked> Speed ramp after impact</label>
    <p class="hint">Drag to orbit, scroll or pinch to zoom, right-drag or shift-drag to pan. Space pauses, → steps one frame, R restarts.</p>
    <div class="stats" id="stats"></div>
  </aside>
</div>

<script>
/*__SIM__*/
/*__RENDER__*/

(function () {
  const $ = (id) => document.getElementById(id);
  const canvas = $('view'), stage = $('stage');
  let R;
  try { R = new Renderer(canvas); }
  catch (e) { $('err').style.display = 'flex'; $('err').textContent = 'This view needs WebGL 2. ' + e.message.split('\n')[0]; console.error(e); return; }

  // ---------------------------------------------------------------- parameters
  const LATEX = {
    red: [0.62, 0.035, 0.03], blue: [0.03, 0.16, 0.62], yellow: [0.78, 0.5, 0.02], green: [0.06, 0.42, 0.09], pink: [0.8, 0.18, 0.38],
  };
  const P = { speed: 360, caliber: 9, offset: 0, energy: 1, radius: 0.08, height: 1, snap: 30, gravity: 9.81, cavity: 0.5, mist: 1, count: 6000, seed: 1337 };
  const L = { az: -55, el: 38, I: 1, exposure: 1.1, scale: 0.7, color: 'red' };
  const S = { playing: true, slowLog: 3.38, ramp: true, follow: true };

  const fmt = {
    speed: (v) => `${v} m/s`, caliber: (v) => `${(+v).toFixed(1)} mm`, offset: (v) => (+v === 0 ? 'centre' : `${v > 0 ? '+' : '−'}${Math.round(Math.abs(v) * 100)}% of radius`),
    energy: (v) => `Cd ${(0.3 * v).toFixed(2)}`, radius: (v) => `${Math.round(v * 200)} cm`, height: (v) => `${(+v).toFixed(2)} m`, snap: (v) => `${v} m/s`,
    gravity: (v) => `${(+v).toFixed(2)} m/s²`, cavity: (v) => `${Math.round(v * 100)}%`, mist: (v) => `${Math.round(v * 100)}%`, count: (v) => `${v}`,
    laz: (v) => `${v}°`, lel: (v) => `${v}°`, lint: (v) => `${(+v).toFixed(2)}×`, expo: (v) => `${(+v).toFixed(2)}`, scale: (v) => `${Math.round(v * 100)}%`,
    slow: (v) => `${Math.round(Math.pow(10, v)).toLocaleString()}×`,
  };

  // ---------------------------------------------------------------- simulation + time
  let sim, snaps, tEnd, seekT = null;
  function restart() {
    sim = new BalloonSim(Object.assign({}, P));
    snaps = [sim.snapshot()];
    tEnd = sim.tImpact + Math.sqrt((2 * Math.max(0.2, P.height)) / Math.max(1, P.gravity)) + 0.55;
    $('tEndLabel').textContent = `${(tEnd * 1000 - sim.tImpact * 1000).toFixed(0)} ms`;
    seekT = null;
    camTarget = [sim.C[0], sim.C[1], sim.C[2]];
    headline();
    dirty = true;
  }
  function headline() {
    const c = +P.caliber;
    const name = Math.abs(c - 9) < 0.15 ? '9 mm round' : Math.abs(c - 5.56) < 0.2 ? '5.56 mm round' : Math.abs(c - 7.62) < 0.2 ? '7.62 mm round' : Math.abs(c - 5.6) < 0.2 ? '.22 round' : `${c.toFixed(1)} mm round`;
    $('headline').textContent = `Water balloon, ${name} at ${P.speed} m/s`;
  }
  function snapInterval(t) { const a = t - sim.tImpact; return a < 0.006 ? 0.0005 : a < 0.06 ? 0.004 : 0.02; }
  function maybeSnap() {
    const last = snaps[snaps.length - 1];
    if (sim.t >= last.t + snapInterval(last.t)) snaps.push(sim.snapshot());
  }
  function rate() {
    const base = 1 / Math.pow(10, S.slowLog);
    if (!S.ramp) return base;
    const after = Math.max(0, sim.t - sim.tImpact);
    return Math.min(base * (1 + after / 0.0009), Math.max(base, 1 / 25));
  }
  function stepTo(goal, budgetMs) {
    const t0 = performance.now();
    while (sim.t < goal - 1e-10 && performance.now() - t0 < budgetMs) {
      let dt = sim.chooseDt();
      if (sim.t + dt > goal) dt = Math.max(goal - sim.t, 1e-7);
      sim.step(dt);
      maybeSnap();
    }
    return sim.t >= goal - 1e-10;
  }
  function seek(T) {
    T = Math.max(0, Math.min(tEnd, T));
    seekT = T;
    if (T < sim.t - 1e-9) {
      let k = snaps.length - 1;
      while (k > 0 && snaps[k].t > T + 1e-12) k--;
      sim.restore(snaps[k]);
    } else {
      // jump forward from the nearest cached state if it is ahead of us
      let k = snaps.length - 1;
      while (k > 0 && snaps[k].t > T + 1e-12) k--;
      if (snaps[k].t > sim.t) sim.restore(snaps[k]);
    }
    dirty = true;
  }

  // ---------------------------------------------------------------- camera
  const cam = { yaw: 0.42, pitch: 0.1, dist: 0.62, fov: 34 };
  let camTarget = [0, 1, 0];
  const VIEWS = {
    side: { yaw: 0.0, pitch: 0.05, dist: 0.62 }, barrel: { yaw: -Math.PI / 2 + 0.22, pitch: 0.12, dist: 0.7 },
    above: { yaw: 0.3, pitch: 1.2, dist: 0.8 }, floor: { yaw: 0.55, pitch: 0.16, dist: 1.1 },
    home: { yaw: 0.42, pitch: 0.1, dist: 0.62 },
  };
  function setView(v) { Object.assign(cam, VIEWS[v]); S.floorCam = v === 'floor'; if (S.floorCam) camTarget = [sim.C[0] + 0.1, 0.16, sim.C[2]]; S.follow = true; $('follow').checked = true; dirty = true; }
  function norm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function camera(w, h) {
    const cp = Math.cos(cam.pitch);
    const pos = [camTarget[0] + cam.dist * cp * Math.sin(cam.yaw), camTarget[1] + cam.dist * Math.sin(cam.pitch), camTarget[2] + cam.dist * cp * Math.cos(cam.yaw)];
    if (pos[1] < 0.02) pos[1] = 0.02;
    const fwd = norm([camTarget[0] - pos[0], camTarget[1] - pos[1], camTarget[2] - pos[2]]);
    const right = norm(cross(fwd, [0, 1, 0]));
    const up = cross(right, fwd);
    const aspect = w / h, tanHalf = Math.tan((cam.fov * Math.PI) / 360);
    const n = 0.01, f = 50;
    // view-projection (column-major)
    const V = [right[0], up[0], -fwd[0], 0, right[1], up[1], -fwd[1], 0, right[2], up[2], -fwd[2], 0,
      -(right[0] * pos[0] + right[1] * pos[1] + right[2] * pos[2]), -(up[0] * pos[0] + up[1] * pos[1] + up[2] * pos[2]), fwd[0] * pos[0] + fwd[1] * pos[1] + fwd[2] * pos[2], 1];
    const fy = 1 / tanHalf, fx = fy / aspect;
    const Pm = [fx, 0, 0, 0, 0, fy, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, (2 * f * n) / (n - f), 0];
    const M = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += Pm[k * 4 + r] * V[c * 4 + k]; M[c * 4 + r] = s; }
    return { pos, fwd, right, up, aspect, tanHalf, viewProj: M };
  }
  function lighting() {
    const az = (L.az * Math.PI) / 180, el = (L.el * Math.PI) / 180;
    const Ld = [Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)];
    const C = sim.C;
    const keyC = [C[0] + Ld[0] * 2.8, C[1] + Ld[1] * 2.8, C[2] + Ld[2] * 2.8];
    const keyU = norm(cross(Ld, [0, 1, 0])), keyV = cross(keyU, Ld);
    const faz = az + 2.6, fel = 0.35;
    const F = [Math.cos(fel) * Math.sin(faz), Math.sin(fel), Math.cos(fel) * Math.cos(faz)];
    const fillC = [C[0] + F[0] * 2.4, C[1] + F[1] * 2.4, C[2] + F[2] * 2.4];
    const fillU = norm(cross(F, [0, 1, 0])), fillV = cross(fillU, F);
    return { L: Ld, I: L.I, fill: F, keyC, keyU, keyV, keyHalf: [0.55, 0.75], fillC, fillU, fillV };
  }

  // ---------------------------------------------------------------- input
  const pointers = new Map();
  let dragMode = null, lastPinch = 0;
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    dragMode = e.button === 2 || e.shiftKey ? 'pan' : 'orbit';
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; lastPinch = Math.hypot(a.x - b.x, a.y - b.y); dragMode = 'pinch'; }
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (dragMode === 'pinch' && pointers.size === 2) {
      const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastPinch > 0) cam.dist = Math.min(6, Math.max(0.12, cam.dist * (lastPinch / d)));
      lastPinch = d;
    } else if (dragMode === 'orbit') {
      cam.yaw -= dx * 0.006; cam.pitch = Math.min(1.5, Math.max(-0.35, cam.pitch + dy * 0.005));
    } else if (dragMode === 'pan') {
      const c = camera(canvas.width, canvas.height);
      const k = cam.dist * 0.0016;
      for (let a = 0; a < 3; a++) camTarget[a] += (-dx * c.right[a] + dy * c.up[a]) * k;
      S.follow = false; $('follow').checked = false;
    }
    dirty = true;
  });
  const endPtr = (e) => { pointers.delete(e.pointerId); if (pointers.size === 0) { dragMode = null; canvas.classList.remove('dragging'); } else if (pointers.size === 1) dragMode = 'orbit'; };
  canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.min(6, Math.max(0.12, cam.dist * Math.exp(e.deltaY * 0.0012))); dirty = true; }, { passive: false });
  canvas.addEventListener('dblclick', () => { setView('home'); S.follow = true; $('follow').checked = true; });

  // ---------------------------------------------------------------- controls
  const physIds = ['speed', 'caliber', 'offset', 'energy', 'radius', 'height', 'snap', 'gravity', 'cavity', 'mist', 'count'];
  let restartTimer = null;
  function bind(id, apply, isPhys) {
    const el = $(id), out = $(id + 'O');
    const show = () => { out.textContent = fmt[id](el.value); };
    show();
    el.addEventListener('input', () => {
      show(); apply(+el.value);
      if (isPhys) { clearTimeout(restartTimer); restartTimer = setTimeout(() => { restart(); setPlaying(true); }, 220); }
      dirty = true;
    });
  }
  for (const id of physIds) bind(id, (v) => { P[id] = v; }, true);
  bind('laz', (v) => (L.az = v)); bind('lel', (v) => (L.el = v)); bind('lint', (v) => (L.I = v));
  bind('expo', (v) => (L.exposure = v)); bind('scale', (v) => (L.scale = v));
  bind('slow', (v) => (S.slowLog = v));
  $('ramp').addEventListener('change', (e) => (S.ramp = e.target.checked));
  $('follow').addEventListener('change', (e) => { S.follow = e.target.checked; dirty = true; });
  const sw = $('swatches');
  for (const k of Object.keys(LATEX)) {
    const b = document.createElement('button');
    b.className = 'swatch'; b.setAttribute('aria-label', k[0].toUpperCase() + k.slice(1)); b.setAttribute('aria-pressed', k === L.color);
    const c = LATEX[k].map((v) => Math.round(Math.pow(Math.min(1, v * 1.35), 1 / 2.2) * 255));
    b.style.background = `rgb(${c})`;
    b.addEventListener('click', () => { L.color = k; for (const x of sw.children) x.setAttribute('aria-pressed', x === b); dirty = true; });
    sw.appendChild(b);
  }
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  function setPlaying(on) {
    S.playing = on;
    $('playText').textContent = on ? 'Pause' : 'Play';
    $('play').setAttribute('aria-label', on ? 'Pause' : 'Play');
    $('playIcon').innerHTML = on ? '<rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/>' : '<path d="M4 2l10 6-10 6z"/>';
  }
  $('play').addEventListener('click', () => { if (!S.playing && sim.t >= tEnd - 1e-6) restart(); setPlaying(!S.playing); });
  $('restart').addEventListener('click', () => { restart(); setPlaying(true); });
  $('step').addEventListener('click', () => { setPlaying(false); seek(sim.t + rate() / 30); });
  const scrub = $('scrub');
  const K = 6;
  const u2t = (u) => (tEnd * (Math.exp(K * u) - 1)) / (Math.exp(K) - 1);
  const t2u = (t) => Math.log(1 + (t / tEnd) * (Math.exp(K) - 1)) / K;
  scrub.addEventListener('input', () => { setPlaying(false); seek(u2t(scrub.value / 1000)); });
  $('settingsBtn').addEventListener('click', () => { const o = $('panel').classList.toggle('open'); $('settingsBtn').setAttribute('aria-expanded', o); });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
    else if (e.code === 'ArrowRight' && e.target.type !== 'range') { e.preventDefault(); $('step').click(); }
    else if (e.key === 'r' || e.key === 'R') { restart(); setPlaying(true); }
  });

  // ---------------------------------------------------------------- frame loop
  let dirty = true, lastVersion = -1, lastNow = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    const w = Math.max(2, Math.round(r.width * dpr)), h = Math.max(2, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; dirty = true; }
  }
  function phaseText() {
    const m = sim.mem, a = sim.t - sim.tImpact;
    if (a < 0) return 'Bullet approaching';
    if (m.tOut < 0) return 'Bullet passing through the water';
    if (!m.gone) return 'Rubber tearing away from the holes';
    const grid = R.grid;
    if (a < 0.04) return 'Water hangs in the air, cavity collapsing';
    if (sim.vmaxBulk > 0.4 && grid.has && grid.center && grid.center[1] > 0.06) return 'Falling';
    return 'Splashing onto the floor';
  }
  function updateHud() {
    const a = (sim.t - sim.tImpact) * 1000;
    const sign = a < 0 ? '−' : '+';
    const digits = Math.abs(a) < 10 ? 3 : Math.abs(a) < 100 ? 2 : 1;
    $('clock').innerHTML = `${sign}${Math.abs(a).toFixed(digits)}<small>ms</small>`;
    const r = rate();
    $('rate').textContent = S.playing ? `${Math.round(1 / r).toLocaleString()}× slower than real time` : 'Paused';
    $('phase').textContent = phaseText();
    if (document.activeElement !== scrub) scrub.value = Math.round(t2u(sim.t) * 1000);
    let alive = 0; for (let i = 0; i < sim.N; i++) alive += sim.alive[i];
    $('stats').textContent = `${alive} water parcels, ${sim.fx.n} spray and mist particles, ${fps.toFixed(0)} fps`;
  }
  function frame(now) {
    const dtReal = Math.min(0.05, (now - lastNow) / 1000);
    lastNow = now;
    resize();
    let busy = false;
    if (seekT !== null) {
      if (stepTo(seekT, 34)) seekT = null; else busy = true;
    } else if (S.playing) {
      stepTo(Math.min(tEnd, sim.t + rate() * dtReal), 26);
      if (sim.t >= tEnd - 1e-6) setPlaying(false);
    }
    $('busy').style.display = busy ? 'block' : 'none';
    if (sim.version !== lastVersion) {
      R.buildVolume(sim); R.buildSprites(sim); lastVersion = sim.version; dirty = true;
    }
    // follow the bulk of the water
    if (S.follow && R.grid.has && R.grid.center && sim.t > sim.tImpact) {
      const k = seekT !== null || !S.playing ? 1 : Math.min(1, dtReal * 2.5);
      const tgt = [R.grid.center[0], S.floorCam ? 0.16 : Math.max(R.grid.center[1], 0.1), R.grid.center[2]];
      for (let a = 0; a < 3; a++) { const d = tgt[a] - camTarget[a]; if (Math.abs(d) > 1e-5) { camTarget[a] += d * k; dirty = true; } }
    } else if (S.follow && sim.t <= sim.tImpact) {
      for (let a = 0; a < 3; a++) camTarget[a] = sim.C[a];
      if (S.floorCam) camTarget[1] = 0.16;
    }
    if (dirty) {
      const c = camera(canvas.width, canvas.height);
      const after = sim.t - sim.tImpact;
      const aerate = after > 0 ? 0.03 * Math.min(1, after / 0.002) * Math.exp(-after / 0.25) * Math.min(2, P.energy * P.speed / 360) : 0;
      R.render(sim, { cam: c, light: lighting(), exposure: L.exposure, latex: LATEX[L.color], focus: sim.C, aerate }, L.scale);
      dirty = false;
      fpsAcc += dtReal; fpsN++;
      if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
    }
    updateHud();
    if (!halted) requestAnimationFrame(frame);
  }
  let halted = false;

  // ---------------------------------------------------------------- test hooks (headless review)
  window.WB = {
    seekMs(ms) { setPlaying(false); seek(sim.tImpact + ms / 1000); return new Promise((res) => { const w = () => (seekT === null ? res(sim.t) : requestAnimationFrame(w)); w(); }); },
    view(v, extra) { setView(v); if (extra) Object.assign(cam, extra); dirty = true; },
    set(k, v) { if (k in P) { P[k] = v; restart(); setPlaying(false); } else if (k in L) L[k] = v; dirty = true; },
    follow(on) { S.follow = on; },
    halt() { halted = true; },
    // synchronous: reach time, build, render (for headless review)
    shot(ms) {
      setPlaying(false);
      seek(sim.tImpact + ms / 1000);
      while (!stepTo(seekT, 1e9)) {}
      seekT = null;
      R.buildVolume(sim); R.buildSprites(sim); lastVersion = sim.version;
      if (S.follow && R.grid.has && sim.t > sim.tImpact) camTarget = [R.grid.center[0], S.floorCam ? 0.16 : Math.max(R.grid.center[1], 0.1), R.grid.center[2]];
      else if (S.follow) { camTarget = sim.C.slice(); if (S.floorCam) camTarget[1] = 0.16; }
      dirty = true; lastNow = performance.now(); frame(performance.now());
      const t0 = performance.now(); R.gl.finish(); return performance.now() - t0;
    },
    get sim() { return sim; }, get R() { return R; }, cam, camTarget: () => camTarget,
  };

  restart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
