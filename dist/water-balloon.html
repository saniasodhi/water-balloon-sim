<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water balloon ballistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(24,28,33,.78);
  --panel-solid:#1b1f24;
  --ink:#e9edf0;
  --muted:#96a2ab;
  --line:rgba(233,237,240,.12);
  --brass:#caa45a;
  --brass-ink:#1c1609;
  --track:rgba(233,237,240,.18);
  --stage:#07080a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --panel: rgba(236,238,240,.86);
    --panel-solid:#eceef0;
    --ink:#1b2126;
    --muted:#56626b;
    --line:rgba(27,33,38,.14);
    --brass:#8f6a22;
    --brass-ink:#fffaf0;
    --track:rgba(27,33,38,.2);
  }
}
:root[data-theme="dark"]{
  --panel: rgba(24,28,33,.78); --panel-solid:#1b1f24; --ink:#e9edf0; --muted:#96a2ab; --line:rgba(233,237,240,.12);
  --brass:#caa45a; --brass-ink:#1c1609; --track:rgba(233,237,240,.18);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;background:var(--stage);color:var(--ink);font-family:"Chivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;overflow:hidden}
.app{position:relative;height:100%;display:grid;grid-template-columns:1fr 316px}
.stage{position:relative;min-width:0;min-height:0;touch-action:none;background:#050607}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#view.dragging{cursor:grabbing}
.title{position:absolute;left:22px;top:18px;pointer-events:none;max-width:min(560px,70%)}
.title h1{margin:0;font-weight:300;font-size:26px;letter-spacing:-.01em;line-height:1.1;color:#f1f3f4;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.clock{margin-top:8px;display:flex;gap:18px;align-items:baseline;font-variant-numeric:tabular-nums;color:#f1f3f4;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.clock .t{font-size:40px;font-weight:800;letter-spacing:-.02em}
.clock .t small{font-size:17px;font-weight:400;margin-left:4px;color:#c9d0d5}
.clock .rate{font-size:14px;color:#c9d0d5}
.phase{margin-top:2px;font-size:14px;color:#c9d0d5;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.transport{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;height:36px;min-width:36px;padding:0 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:600;min-width:86px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn svg{width:16px;height:16px;fill:currentColor}
.scrub{flex:1;min-width:80px;display:flex;flex-direction:column;gap:2px}
.scrub .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--track);border-radius:3px}
input[type=range]::-moz-range-track{height:3px;background:var(--track);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--brass);margin-top:-6px;border:2px solid var(--panel-solid)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--brass);border:2px solid var(--panel-solid)}
.panel{background:var(--panel-solid);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px}
.panel h2{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 6px;letter-spacing:.01em}
.panel h2:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;margin:8px 0 2px}
.row label{font-size:14px}
.row output{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1 / -1}
.swatches{display:flex;gap:8px;margin:10px 0 4px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),inset 0 4px 8px rgba(255,255,255,.25)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0 2px;cursor:pointer}
.check input{accent-color:var(--brass);width:16px;height:16px}
.hint{font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:14px}
.settings-toggle{display:none}
.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:#e9edf0}
.busy{position:absolute;right:18px;top:18px;font-size:13px;color:#d6dcdf;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:8px;display:none}
@media (max-width: 820px){
  .app{grid-template-columns:1fr}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:62%;z-index:5;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s ease;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .panel.open{transform:none}
  .settings-toggle{display:inline-flex}
  .title h1{font-size:19px}
  .clock .t{font-size:30px}
  .transport{flex-wrap:wrap;left:8px;right:8px;bottom:8px}
  .scrub{order:5;flex-basis:100%}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){ .panel{transition:none} }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="view" aria-label="3D view of the simulation. Drag to orbit, scroll to zoom, right-drag to pan."></canvas>
    <div class="title">
      <h1 id="headline">Water balloon, 9 mm round at 360 m/s</h1>
      <div class="clock"><span class="t" id="clock">−0.37<small>ms</small></span><span class="rate" id="rate">2 400× slower</span></div>
      <div class="phase" id="phase">Bullet approaching</div>
    </div>
    <div class="busy" id="busy">Simulating…</div>
    <div class="transport">
      <button class="btn primary" id="play" aria-label="Pause"><svg viewBox="0 0 16 16" id="playIcon"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg><span id="playText">Pause</span></button>
      <button class="btn" id="step" title="Step forward one frame (→)" aria-label="Step forward"><svg viewBox="0 0 16 16"><path d="M3 2l8 6-8 6z"/><rect x="12" y="2" width="2" height="12"/></svg></button>
      <button class="btn" id="restart" title="Restart (R)" aria-label="Restart"><svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.7.6A3.7 3.7 0 1 0 8 4.3V6.5L4.5 3.5 8 0.5z"/></svg></button>
      <div class="scrub">
        <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Timeline">
        <div class="ticks"><span>shot</span><span id="tEndLabel">0.9 s</span></div>
      </div>
      <button class="btn settings-toggle" id="settingsBtn" aria-expanded="false" aria-controls="panel">Settings</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <aside class="panel" id="panel" aria-label="Simulation settings">
    <h2>Shot</h2>
    <div class="row"><label for="speed">Bullet speed</label><output id="speedO"></output><input type="range" id="speed" min="120" max="1000" step="10" value="360"></div>
    <div class="row"><label for="caliber">Caliber</label><output id="caliberO"></output><input type="range" id="caliber" min="4.5" max="12.7" step="0.1" value="9"></div>
    <div class="row"><label for="offset">Impact height</label><output id="offsetO"></output><input type="range" id="offset" min="-0.7" max="0.7" step="0.05" value="0"></div>
    <div class="row"><label for="energy">Drag in water</label><output id="energyO"></output><input type="range" id="energy" min="0.1" max="2" step="0.05" value="1"></div>

    <h2>Balloon</h2>
    <div class="row"><label for="radius">Diameter</label><output id="radiusO"></output><input type="range" id="radius" min="0.05" max="0.14" step="0.005" value="0.08"></div>
    <div class="row"><label for="height">Hanging height</label><output id="heightO"></output><input type="range" id="height" min="0.4" max="2" step="0.05" value="1"></div>
    <div class="row"><label for="snap">Rubber snap speed</label><output id="snapO"></output><input type="range" id="snap" min="6" max="80" step="1" value="30"></div>
    <div class="swatches" role="group" aria-label="Balloon color" id="swatches"></div>

    <h2>Physics</h2>
    <div class="row"><label for="gravity">Gravity</label><output id="gravityO"></output><input type="range" id="gravity" min="0" max="25" step="0.01" value="9.81"></div>
    <div class="row"><label for="cavity">Cavity collapse</label><output id="cavityO"></output><input type="range" id="cavity" min="0" max="1" step="0.05" value="0.5"></div>
    <div class="row"><label for="mist">Spray and mist</label><output id="mistO"></output><input type="range" id="mist" min="0" max="2" step="0.05" value="1"></div>
    <div class="row"><label for="count">Water particles</label><output id="countO"></output><input type="range" id="count" min="1500" max="12000" step="100" value="6000"></div>

    <h2>Light and camera</h2>
    <div class="row"><label for="laz">Light direction</label><output id="lazO"></output><input type="range" id="laz" min="-180" max="180" step="1" value="-55"></div>
    <div class="row"><label for="lel">Light height</label><output id="lelO"></output><input type="range" id="lel" min="5" max="85" step="1" value="38"></div>
    <div class="row"><label for="lint">Light intensity</label><output id="lintO"></output><input type="range" id="lint" min="0.2" max="3" step="0.05" value="1"></div>
    <div class="row"><label for="expo">Exposure</label><output id="expoO"></output><input type="range" id="expo" min="0.3" max="3" step="0.05" value="1.1"></div>
    <div class="row"><label for="scale">Render resolution</label><output id="scaleO"></output><input type="range" id="scale" min="0.3" max="1" step="0.05" value="0.7"></div>
    <div class="views">
      <button class="btn" data-view="side">Side</button>
      <button class="btn" data-view="barrel">Down the barrel</button>
      <button class="btn" data-view="above">Above</button>
      <button class="btn" data-view="floor">Floor</button>
    </div>
    <label class="check"><input type="checkbox" id="follow" checked> Follow the water</label>

    <h2>Playback</h2>
    <div class="row"><label for="slow">Slow motion at impact</label><output id="slowO"></output><input type="range" id="slow" min="1.3" max="4.3" step="0.05" value="3.38"></div>
    <label class="check"><input type="checkbox" id="ramp" checked> Speed ramp after impact</label>
    <p class="hint">Drag to orbit, scroll or pinch to zoom, right-drag or shift-drag to pan. Space pauses, → steps one frame, R restarts.</p>
    <div class="stats" id="stats"></div>
  </aside>
</div>

<script>
// ---------------------------------------------------------------------------
// Water balloon ballistics simulation
// Position-based "double density relaxation" fluid (Clavet et al. 2005),
// latex membrane with propagating tear, hydrodynamic-ram energy deposition,
// secondary spray + mist particles, ground wetting.  Units: metres, seconds.
// ---------------------------------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const RHO_W = 1000, RHO_AIR = 1.2;
const WET_RES = 256, WET_EXT = 1.6; // wetness map covers [-EXT, EXT]^2 on the ground
const FX_CAP = 14000;
const P_ATM = 101325;
const DT_REF = 4e-4;   // step size at which the relaxation stiffness was tuned
const V_JET = 18;     // m/s: faster fluid atomises into spray

class BalloonSim {
  constructor(params) { this.reset(params); }

  reset(params) {
    const p = (this.p = Object.assign({}, params));
    this.rng = mulberry32(p.seed || 1337);
    const R = (this.R = p.radius);
    this.ry = 0.95;                         // slight vertical squash of a hanging balloon
    this.C = [0, p.height, 0];
    const V = (4 / 3) * Math.PI * R * R * R * this.ry;
    const s = (this.s = Math.cbrt(V / p.count));
    this.h = 1.9 * s;
    // resolution-independent material: the relaxation displacement scales with h, so the stiffness
    // (sound speed) and the XSPH damping (kinematic viscosity ~ c h^2/dt) are normalised to a
    // reference spacing; the finer the particles, the more they need to reach the same physics
    const S_REF = 0.0086, rr = S_REF / s;
    this.resK = Math.min(2.2, rr * rr);
    this.resV = Math.min(5.0, Math.pow(rr, 6.5));
    this.rp = 0.45 * s;                     // collision radius vs ground

    // --- fill the balloon with a jittered lattice --------------------------------
    const pts = [];
    const inset = 1 - (0.62 * s) / R;
    const n = Math.ceil(R / s) + 1;
    for (let i = -n; i <= n; i++)
      for (let j = -n; j <= n; j++)
        for (let k = -n; k <= n; k++) {
          const x = (i + (j & 1) * 0.5) * s, y = j * s * 0.866, z = (k + (i & 1) * 0.5) * s;
          const q = Math.hypot(x / R, y / (R * this.ry), z / R);
          if (q < inset) pts.push(x, y, z);
        }
    const N = (this.N = pts.length / 3);
    this.pos = new Float32Array(N * 3);
    this.prev = new Float32Array(N * 3);
    this.vel = new Float32Array(N * 3);
    this.alive = new Uint8Array(N).fill(1);
    this.nb = new Uint16Array(N);
    this.nbSmooth = new Float32Array(N);
    this.groundT = new Float32Array(N);
    this.foam = new Float32Array(N);   // entrained micro-bubbles (0..1): cavity collapse, floor impact
    this.rho = new Float32Array(N);
    this.P = new Float32Array(N);
    this.PN = new Float32Array(N);
    this.dx = new Float32Array(N * 3);
    this.dv = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      this.pos[i * 3] = pts[i * 3] + this.C[0] + (this.rng() - 0.5) * 0.5 * s;
      this.pos[i * 3 + 1] = pts[i * 3 + 1] + this.C[1] + (this.rng() - 0.5) * 0.5 * s;
      this.pos[i * 3 + 2] = pts[i * 3 + 2] + this.C[2] + (this.rng() - 0.5) * 0.5 * s;
    }
    // neighbour structures
    this.TABLE = 1 << 15;
    this.cellStart = new Int32Array(this.TABLE + 1);
    this.cellIdx = new Int32Array(N);
    this.sorted = new Int32Array(N);
    this.pairCap = N * 45;
    this.pa = new Int32Array(this.pairCap);
    this.pb = new Int32Array(this.pairCap);
    this.pq = new Float32Array(this.pairCap);
    this.npairs = 0;

    // --- bullet --------------------------------------------------------------------
    const cal = p.caliber * 1e-3;
    this.bullet = {
      r: cal / 2,
      len: cal * 3.6,
      mass: 0.0097 * Math.pow(p.caliber / 7.62, 3),
      y: this.C[1] + p.offset * R * this.ry * 0.85,
      z: 0,
      x: this.C[0] - R - 0.3,
      v: p.speed,
      v0: p.speed,
      inWater: false,
    };
    const b = this.bullet;
    const dy = (b.y - this.C[1]) / (R * this.ry);
    const half = R * Math.sqrt(Math.max(0, 1 - dy * dy));
    this.xIn = this.C[0] - half;
    this.xOut = this.C[0] + half;
    this.tImpact = (this.xIn - b.x) / b.v;
    const len = (x) => { const d = [x - this.C[0], b.y - this.C[1], b.z - this.C[2]]; const l = Math.hypot(...d); return d.map((v) => v / l); };
    this.e1 = len(this.xIn);
    this.e2 = len(this.xOut);

    // --- membrane ----------------------------------------------------------------
    this.mem = { cavClosed: false, tIn: -1, tOut: -1, th1: 0, th2: 0, alpha: 4, gone: false, tGone: -1 };

    // --- secondary particles --------------------------------------------------------
    this.fx = {
      n: 0, head: 0,
      pos: new Float32Array(FX_CAP * 3), vel: new Float32Array(FX_CAP * 3),
      age: new Float32Array(FX_CAP), life: new Float32Array(FX_CAP),
      size: new Float32Array(FX_CAP), type: new Uint8Array(FX_CAP), alive: new Uint8Array(FX_CAP),
    };
    this.wet = new Float32Array(WET_RES * WET_RES);
    this.wetDirty = true;

    this.t = 0;
    this.vmaxBulk = 0;
    this.steps = 0;
    this.version = 0;

    // --- settle: find rest density, relax lattice inside the membrane --------------
    this.buildPairs();
    this.computeDensity();
    let acc = 0, cnt = 0;
    for (let i = 0; i < N; i++) if (this.nb[i] >= 16) { acc += this.rho[i]; cnt++; }
    this.rho0 = cnt ? acc / cnt : 3;
    for (let it = 0; it < 30; it++) {
      this.prev.set(this.pos);
      this.buildPairs();
      this.relax(1, DT_REF);
      this.constrain(DT_REF);
    }
    this.vel.fill(0);
    this.buildPairs();
    // re-measure rest density on the settled packing so the fluid starts in equilibrium
    this.relaxDensityOnly();
    let mx = 0; for (let i = 0; i < N; i++) mx = Math.max(mx, this.nb[i]);
    acc = 0; cnt = 0;
    for (let i = 0; i < N; i++) if (this.nb[i] >= 0.85 * mx) { acc += this.rho[i]; cnt++; }
    if (cnt) this.rho0 = acc / cnt;
    // pre-roll with gravity so the hanging balloon starts at rest in equilibrium
    const g0 = p.gravity, dt0 = DT_REF;
    for (let it = 0; it < 70; it++) {
      for (let i = 0; i < N; i++) this.vel[i * 3 + 1] -= g0 * dt0;
      this.prev.set(this.pos);
      for (let i = 0; i < N * 3; i++) this.pos[i] += this.vel[i] * dt0;
      this.buildPairs();
      this.relax(1, dt0);
      this.constrain(dt0);
      for (let i = 0; i < N * 3; i++) this.vel[i] = (this.pos[i] - this.prev[i]) / dt0 * 0.6;
    }
    this.vel.fill(0);
    this.buildPairs();
    for (let i = 0; i < N; i++) this.nbSmooth[i] = this.nb[i];
  }

  // ---- membrane geometry ------------------------------------------------------------
  angTo(dx, dy, dz, e) { return Math.acos(Math.max(-1, Math.min(1, dx * e[0] + dy * e[1] + dz * e[2]))); }
  memIntact(dx, dy, dz) { // unit direction from centre
    const m = this.mem;
    if (m.gone) return false;
    if (m.tIn >= 0 && this.angTo(dx, dy, dz, this.e1) < m.th1) return false;
    if (m.tOut >= 0 && this.angTo(dx, dy, dz, this.e2) < m.th2) return false;
    if (Math.acos(Math.max(-1, Math.min(1, dy))) > m.alpha) return false;
    return true;
  }

  // ---- neighbour search -------------------------------------------------------------------
  buildPairs() {
    const { N, pos, alive, TABLE, cellStart, cellIdx, sorted } = this;
    // Verlet neighbour list: candidates are gathered within h*(1+SKIN) and reused until some
    // particle has moved more than half the skin; each step only refreshes distances
    const SKIN = 0;   // measured: fast spray particles force a rebuild nearly every step, so lists are rebuilt each step
    if (SKIN > 0 && this.vpos && !this.pairsDirty) {
      const vp = this.vpos, lim2 = (0.5 * SKIN * this.h) ** 2;
      let ok = true;
      for (let i = 0; i < N; i++) {
        if (!alive[i]) continue;
        const dx = pos[i * 3] - vp[i * 3], dy = pos[i * 3 + 1] - vp[i * 3 + 1], dz = pos[i * 3 + 2] - vp[i * 3 + 2];
        if (dx * dx + dy * dy + dz * dz > lim2) { ok = false; break; }
      }
      if (ok) { this.refreshPairs(); return; }
    }
    this.pairsDirty = false;
    if (SKIN > 0) { this.vpos = this.vpos && this.vpos.length === pos.length ? this.vpos : new Float32Array(pos.length); this.vpos.set(pos); }
    this.rebuilds = (this.rebuilds || 0) + 1;
    const inv = 1 / (this.h * (1 + SKIN));
    cellStart.fill(0);
    const hash = (x, y, z) => ((Math.imul(x, 92837111) ^ Math.imul(y, 689287499) ^ Math.imul(z, 283923481)) >>> 0) & (TABLE - 1);
    for (let i = 0; i < N; i++) {
      if (!alive[i]) { cellIdx[i] = -1; continue; }
      const c = hash(Math.floor(pos[i * 3] * inv), Math.floor(pos[i * 3 + 1] * inv), Math.floor(pos[i * 3 + 2] * inv));
      cellIdx[i] = c; cellStart[c + 1]++;
    }
    for (let c = 0; c < TABLE; c++) cellStart[c + 1] += cellStart[c];
    const fill = this._fill || (this._fill = new Int32Array(TABLE));
    fill.set(cellStart.subarray(0, TABLE));
    for (let i = 0; i < N; i++) if (cellIdx[i] >= 0) sorted[fill[cellIdx[i]]++] = i;

    const h2 = (this.h * (1 + SKIN)) ** 2, hq2 = this.h * this.h;
    let np = 0;
    const { pa, pb, pq, nb } = this;
    nb.fill(0);
    // half-shell stencil: own cell (j > i) + 13 forward cells, visited in spatially sorted order
    const OFF = this._off || (this._off = (() => {
      const o = [];
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) for (let oz = -1; oz <= 1; oz++)
        if (ox > 0 || (ox === 0 && oy > 0) || (ox === 0 && oy === 0 && oz > 0)) o.push(ox, oy, oz);
      return o;
    })());
    const hh = this.h, cap = this.pairCap;
    for (let si = 0; si < N; si++) {
      const i = sorted[si];
      if (si >= cellStart[TABLE]) break;
      const xi = pos[i * 3], yi = pos[i * 3 + 1], zi = pos[i * 3 + 2];
      const cx = Math.floor(xi * inv), cy = Math.floor(yi * inv), cz = Math.floor(zi * inv);
      const c0 = cellIdx[i];
      for (let k = cellStart[c0], e = cellStart[c0 + 1]; k < e; k++) {
        const j = sorted[k];
        if (j <= i) continue;
        const dx = pos[j * 3] - xi, dy = pos[j * 3 + 1] - yi, dz = pos[j * 3 + 2] - zi;
        const d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < h2 && np < cap) { pa[np] = i; pb[np] = j; pq[np] = Math.sqrt(d2) / hh; np++; if (d2 < hq2) { nb[i]++; nb[j]++; } }
      }
      for (let t = 0; t < 39; t += 3) {
        const c = hash(cx + OFF[t], cy + OFF[t + 1], cz + OFF[t + 2]);
        if (c === c0) continue;
        for (let k = cellStart[c], e = cellStart[c + 1]; k < e; k++) {
          const j = sorted[k];
          const dx = pos[j * 3] - xi, dy = pos[j * 3 + 1] - yi, dz = pos[j * 3 + 2] - zi;
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 < h2 && np < cap) { pa[np] = i; pb[np] = j; pq[np] = Math.sqrt(d2) / hh; np++; if (d2 < hq2) { nb[i]++; nb[j]++; } }
        }
      }
    }
    this.npairs = np;
  }

  refreshPairs() {
    const { pos, pa, pb, pq, nb, npairs } = this;
    const ih = 1 / this.h;
    nb.fill(0);
    for (let k = 0; k < npairs; k++) {
      const i = pa[k], j = pb[k];
      const dx = pos[j * 3] - pos[i * 3], dy = pos[j * 3 + 1] - pos[i * 3 + 1], dz = pos[j * 3 + 2] - pos[i * 3 + 2];
      const q = Math.sqrt(dx * dx + dy * dy + dz * dz) * ih;
      pq[k] = q;
      if (q < 1) { nb[i]++; nb[j]++; }
    }
  }

  computeDensity() {
    const { rho, npairs, pa, pb, pq } = this;
    rho.fill(1); // self contribution
    for (let k = 0; k < npairs; k++) {
      if (pq[k] >= 1) continue;
      const w = 1 - pq[k], w2 = w * w;
      rho[pa[k]] += w2; rho[pb[k]] += w2;
    }
  }

  relaxDensityOnly() {
    const { rho, pa, pb, pos } = this; const h = this.h;
    rho.fill(1);
    for (let k = 0; k < this.npairs; k++) {
      const i = pa[k], j = pb[k];
      const q = Math.hypot(pos[j * 3] - pos[i * 3], pos[j * 3 + 1] - pos[i * 3 + 1], pos[j * 3 + 2] - pos[i * 3 + 2]) / h;
      if (q < 1) { const w = 1 - q; rho[i] += w * w; rho[j] += w * w; }
    }
  }
  // ---- double density relaxation (Jacobi, symmetric) ----------------------------------
  relax(iters, dt) {
    const { pos, rho, P, PN, dx, pa, pb, alive, N } = this;
    // stiffness scales with dt^2 (Clavet): physical pressure, not per-step displacement
    const f = Math.min(1, (dt * dt) / (DT_REF * DT_REF)) * this.resK;
    const h = this.h, kP = (this.kP || 0.055) * f, kN = (this.kN || 0.02) * f, rho0 = this.rho0, tc = this.tc || 0.4;
    for (let it = 0; it < iters; it++) {
      rho.fill(1);
      const rn = this.PN; rn.fill(1);
      for (let k = 0; k < this.npairs; k++) {
        const i = pa[k], j = pb[k];
        const ddx = pos[j * 3] - pos[i * 3], ddy = pos[j * 3 + 1] - pos[i * 3 + 1], ddz = pos[j * 3 + 2] - pos[i * 3 + 2];
        const q = Math.sqrt(ddx * ddx + ddy * ddy + ddz * ddz) / h;
        this.pq[k] = q;
        if (q >= 1) continue;
        const w = 1 - q, w2 = w * w;
        rho[i] += w2; rho[j] += w2; rn[i] += w2 * w; rn[j] += w2 * w;
      }
      for (let i = 0; i < N; i++) {
        let pr = kP * (rho[i] - rho0);
        if (pr < -tc * kP * rho0) pr = -tc * kP * rho0; // limited tension (cohesion / surface tension)
        P[i] = pr; PN[i] = kN * rn[i];
      }
      dx.fill(0);
      for (let k = 0; k < this.npairs; k++) {
        const q = this.pq[k];
        if (q >= 1 || q < 1e-6) continue;
        const i = pa[k], j = pb[k];
        const w = 1 - q;
        const D = 0.5 * h * ((P[i] + P[j]) * w + (PN[i] + PN[j]) * w * w) * 0.5;
        const inv = 1 / (q * h);
        const ux = (pos[j * 3] - pos[i * 3]) * inv, uy = (pos[j * 3 + 1] - pos[i * 3 + 1]) * inv, uz = (pos[j * 3 + 2] - pos[i * 3 + 2]) * inv;
        dx[i * 3] -= D * ux; dx[i * 3 + 1] -= D * uy; dx[i * 3 + 2] -= D * uz;
        dx[j * 3] += D * ux; dx[j * 3 + 1] += D * uy; dx[j * 3 + 2] += D * uz;
      }
      const lim = 0.3 * this.s;
      for (let i = 0; i < N; i++) {
        if (!alive[i]) continue;
        let a = dx[i * 3], b = dx[i * 3 + 1], c = dx[i * 3 + 2];
        const l = Math.hypot(a, b, c);
        if (l > lim) { const f = lim / l; a *= f; b *= f; c *= f; }
        pos[i * 3] += a; pos[i * 3 + 1] += b; pos[i * 3 + 2] += c;
      }
    }
  }

  constrain(dt) {
    const { pos, prev, alive, N, C, R } = this;
    const ry = this.ry, rp = this.rp;
    const shell = 1 - (0.55 * this.s) / R;
    const memActive = !this.mem.gone;
    for (let i = 0; i < N; i++) {
      if (!alive[i]) continue;
      const o = i * 3;
      if (memActive) {
        const lx = (pos[o] - C[0]) / R, ly = (pos[o + 1] - C[1]) / (R * ry), lz = (pos[o + 2] - C[2]) / R;
        const q = Math.hypot(lx, ly, lz);
        if (q > shell) {
          const dxn = lx / q, dyn = ly / q, dzn = lz / q;
          // only the part of the ray from the centre that is still covered by rubber holds water
          if (q < 1.25 && this.memIntact(dxn, dyn, dzn)) {
            const f = shell / q;
            pos[o] = C[0] + lx * f * R; pos[o + 1] = C[1] + ly * f * R * ry; pos[o + 2] = C[2] + lz * f * R;
          }
        }
      }
      if (pos[o + 1] < rp) {
        // impact on the floor: the rim of the spreading sheet throws a crown of droplets
        const vy = (pos[o + 1] - prev[o + 1]) / dt;
        if (vy < -1.5) this.foam[i] = Math.min(0.6, this.foam[i] + (-vy - 1.5) * 0.12);
        if (vy < -1.2 && this.gc && this.rng() < 0.45) {
          let rx = pos[o] - this.gc[0], rz = pos[o + 2] - this.gc[1];
          const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
          const a = -vy, jit = () => (this.rng() - 0.5) * 0.4;
          const hs = a * (1.0 + 1.1 * this.rng()), up = a * (0.35 + 0.75 * this.rng());
          this.emit(0, pos[o], rp + 0.002, pos[o + 2], (rx + jit()) * hs, up, (rz + jit()) * hs, 0.0007 + 0.0018 * this.rng(), 3);
        }
        // stagnation pressure turns the fall into radial spreading of the sheet
        if (vy < -0.3 && this.gc) {
          let rx = pos[o] - this.gc[0], rz = pos[o + 2] - this.gc[1];
          const rl = Math.hypot(rx, rz);
          if (rl > 1e-4) { const add = 0.3 * -vy * dt / rl; prev[o] -= rx * add; prev[o + 2] -= rz * add; }
        }
        pos[o + 1] = rp;
        // ground friction: damp tangential motion of this step
        const fr = Math.min(1, dt / 0.025);   // thin viscous boundary layer: the sheet still spreads
        pos[o] = pos[o] - (pos[o] - prev[o]) * fr;
        pos[o + 2] = pos[o + 2] - (pos[o + 2] - prev[o + 2]) * fr;
        if (prev[o + 1] < rp) prev[o + 1] = rp;
        // crown: the thickened rim of the fast-spreading sheet lifts off the floor
        if (this.gc && this.nb[i] < 15) {
          let rx = pos[o] - this.gc[0], rz = pos[o + 2] - this.gc[1];
          const rl = Math.hypot(rx, rz);
          if (rl > 0.03) {
            const vr = ((pos[o] - prev[o]) * rx + (pos[o + 2] - prev[o + 2]) * rz) / (rl * dt);
            if (vr > 1.0) prev[o + 1] = rp - 0.35 * (vr - 1.0) * (0.5 + this.rng()) * dt;
          }
        }
      }
    }
  }

  // ---- energy deposition from the projectile --------------------------------------------
  applyBullet(xa, xb) {
    const b = this.bullet, p = this.p;
    if (xb < this.xIn || xa > this.xOut) return;
    const x0 = Math.max(xa, this.xIn), x1 = Math.min(xb, this.xOut);
    if (x1 <= x0) return;
    // drag force per unit length = energy deposited per unit length
    const A = Math.PI * b.r * b.r;
    const Cd = 0.3 * p.energy;
    const F = 0.5 * RHO_W * Cd * A * b.v * b.v;
    const ac = Math.max(1.1 * this.s, 4 * b.r);
    const L = Math.log(Math.max(1.5, this.R / ac));
    const U = Math.sqrt(F / (Math.PI * RHO_W * ac * ac * L));
    const { pos, vel, prev, alive, N } = this;
    for (let i = 0; i < N; i++) {
      if (!alive[i]) continue;
      const o = i * 3;
      const px = pos[o];
      if (px < x0 || px >= x1) continue;
      const ry = pos[o + 1] - b.y, rz = pos[o + 2] - b.z;
      const d = Math.hypot(ry, rz) + 1e-6;
      const dd = Math.max(d, ac);
      let vr = U * (ac / dd) * Math.exp(-0.35 * dd / ac);
      vr *= 0.85 + 0.3 * this.rng();
      const near = Math.exp(-d / ac);
      this.foam[i] = Math.max(this.foam[i], 0.7 * Math.exp(-(d * d) / (ac * ac)));
      // radial cavity flow + forward drag of fluid near the shot line
      vel[o + 1] += vr * ry / d;
      vel[o + 2] += vr * rz / d;
      vel[o] += vr * (0.55 * near + 0.08) * (0.7 + 0.6 * this.rng());
      // back-splash near the entry, forward jet near the exit
      const fromIn = (px - this.xIn) / (this.xOut - this.xIn);
      if (fromIn < 0.18) vel[o] -= vr * 0.9 * (1 - fromIn / 0.18) * near;
      if (fromIn > 0.8) vel[o] += vr * 0.8 * ((fromIn - 0.8) / 0.2) * near;
      const cap = 0.22 * b.v;
      const sp = Math.hypot(vel[o], vel[o + 1], vel[o + 2]);
      if (sp > cap) { const f = cap / sp; vel[o] *= f; vel[o + 1] *= f; vel[o + 2] *= f; }
    }
    // bullet decelerates
    b.v = Math.max(0.2 * b.v0, b.v - (F * (x1 - x0)) / (b.mass * b.v));
  }

  // ---- secondary particles ----------------------------------------------------------
  emit(type, x, y, z, vx, vy, vz, size, life) {
    const f = this.fx;
    const i = f.head;
    f.head = (f.head + 1) % FX_CAP;
    if (!f.alive[i]) f.n++;
    f.alive[i] = 1; f.type[i] = type;
    f.pos[i * 3] = x; f.pos[i * 3 + 1] = y; f.pos[i * 3 + 2] = z;
    f.vel[i * 3] = vx; f.vel[i * 3 + 1] = vy; f.vel[i * 3 + 2] = vz;
    f.age[i] = 0; f.life[i] = life; f.size[i] = size;
  }
  randCone(ax, ay, az, spread) {
    // random unit vector within a cone around (ax,ay,az)
    const r = this.rng;
    let ux = r() * 2 - 1, uy = r() * 2 - 1, uz = r() * 2 - 1;
    const dot = ux * ax + uy * ay + uz * az;
    ux -= dot * ax; uy -= dot * ay; uz -= dot * az;
    const ul = Math.hypot(ux, uy, uz) + 1e-9;
    const ang = spread * Math.sqrt(r());
    const c = Math.cos(ang), s = Math.sin(ang);
    return [ax * c + (ux / ul) * s, ay * c + (uy / ul) * s, az * c + (uz / ul) * s];
  }
  emitHole(dt, which) {
    const m = this.mem, p = this.p, b = this.bullet;
    const t0 = which === 0 ? m.tIn : m.tOut;
    if (t0 < 0) return;
    const age = this.t - t0;
    if (age > 0.004) return;
    const X = which === 0 ? this.xIn : this.xOut;
    const k = Math.exp(-age / 0.0012);
    const vb = b.v0 * Math.sqrt(p.energy);
    const baseRate = (which === 0 ? 0.9e6 : 1.8e6) * p.mist * Math.min(1.5, p.energy * b.v0 / 600); // particles per second of physical time
    let cnt = baseRate * k * dt;
    cnt = Math.floor(cnt) + (this.rng() < cnt % 1 ? 1 : 0);
    const ax = which === 0 ? -0.75 : 1, ay = 0, az = 0;
    const e = which === 0 ? this.e1 : this.e2;
    let dx = ax + e[0] * 0.5, dy = ay + e[1] * 0.5, dz = az + e[2] * 0.5;
    const l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;
    for (let c = 0; c < cnt; c++) {
      const mist = this.rng() < 0.45;
      const spread = which === 0 ? 0.95 : 0.55;
      const d = this.randCone(dx, dy, dz, spread * (mist ? 1.25 : 1));
      const sp = vb * (which === 0 ? 0.035 : 0.075) * (0.25 + 0.75 * Math.pow(this.rng(), 0.6)) * (0.5 + 0.5 * k);
      const jx = (this.rng() - 0.5) * 0.01, jy = (this.rng() - 0.5) * 0.01, jz = (this.rng() - 0.5) * 0.01;
      if (mist) this.emit(1, X + jx, b.y + jy, b.z + jz, d[0] * sp, d[1] * sp, d[2] * sp, 0.004 + 0.004 * this.rng(), 0.35 + 0.6 * this.rng());
      else this.emit(0, X + jx, b.y + jy, b.z + jz, d[0] * sp, d[1] * sp, d[2] * sp, 0.0006 + 0.0016 * Math.pow(this.rng(), 2), 3);
    }
  }
  atomise(i, sp) {
    // a fluid parcel moving faster than the sheet can hold together shatters into drops + mist
    const o = i * 3, { pos, vel } = this;
    this.alive[i] = 0; this.pairsDirty = true;
    const r = this.rng;
    const nd = 3 + Math.floor(r() * 3);
    for (let k = 0; k < nd; k++) {
      const j = 0.18;
      this.emit(0, pos[o] + (r() - 0.5) * this.s, pos[o + 1] + (r() - 0.5) * this.s, pos[o + 2] + (r() - 0.5) * this.s,
        vel[o] * (1 + (r() - 0.5) * j), vel[o + 1] * (1 + (r() - 0.5) * j) + (r() - 0.5) * sp * 0.08, vel[o + 2] * (1 + (r() - 0.5) * j) + (r() - 0.5) * sp * 0.08,
        0.0008 + 0.0022 * Math.pow(r(), 1.5), 3);
    }
    if (this.p.mist > 0 && r() < 0.8 * this.p.mist)
      this.emit(1, pos[o], pos[o + 1], pos[o + 2], vel[o] * 0.8, vel[o + 1] * 0.8, vel[o + 2] * 0.8, 0.004 + 0.004 * r(), 0.4 + 0.6 * r());
  }
  updateFx(dt) {
    const f = this.fx, g = this.p.gravity;
    let n = 0;
    for (let i = 0; i < FX_CAP; i++) {
      if (!f.alive[i]) continue;
      const o = i * 3;
      f.age[i] += dt;
      if (f.type[i] === 0) {
        const vx = f.vel[o], vy = f.vel[o + 1], vz = f.vel[o + 2];
        const sp = Math.hypot(vx, vy, vz);
        const k = (3 * RHO_AIR * 0.47) / (8 * RHO_W * f.size[i]);
        const damp = 1 / (1 + k * sp * dt);
        f.vel[o] = vx * damp; f.vel[o + 1] = (vy - g * dt) * damp; f.vel[o + 2] = vz * damp;
      } else {
        const damp = Math.exp(-dt / 0.03);
        f.vel[o] *= damp; f.vel[o + 1] = f.vel[o + 1] * damp - 0.03 * g * dt; f.vel[o + 2] *= damp;
        f.size[i] += dt * 0.05;
      }
      f.pos[o] += f.vel[o] * dt; f.pos[o + 1] += f.vel[o + 1] * dt; f.pos[o + 2] += f.vel[o + 2] * dt;
      if (f.pos[o + 1] < 0) {
        if (f.type[i] === 0) { this.deposit(f.pos[o], f.pos[o + 2], f.size[i] * 6, 0.02); f.alive[i] = 0; continue; }
        f.pos[o + 1] = 0; f.vel[o + 1] = 0;
      }
      if (f.age[i] > f.life[i]) { f.alive[i] = 0; continue; }
      n++;
    }
    f.n = n;
  }

  deposit(x, z, radius, amount) {
    const cell = (2 * WET_EXT) / WET_RES;
    const cx = (x + WET_EXT) / cell, cz = (z + WET_EXT) / cell;
    const rr = Math.max(1, radius / cell);
    const i0 = Math.max(0, Math.floor(cx - rr * 2)), i1 = Math.min(WET_RES - 1, Math.ceil(cx + rr * 2));
    const j0 = Math.max(0, Math.floor(cz - rr * 2)), j1 = Math.min(WET_RES - 1, Math.ceil(cz + rr * 2));
    for (let j = j0; j <= j1; j++)
      for (let i = i0; i <= i1; i++) {
        const d2 = ((i + 0.5 - cx) ** 2 + (j + 0.5 - cz) ** 2) / (rr * rr);
        const w = Math.exp(-d2 * 1.5) * amount;
        this.wet[j * WET_RES + i] = Math.min(4, this.wet[j * WET_RES + i] + w);
      }
    this.wetDirty = true;
  }

  // ---- time stepping ------------------------------------------------------------------
  chooseDt() {
    let dt = (0.45 * this.s) / Math.max(this.vmaxBulk, 0.6);
    dt = Math.min(Math.max(dt, 2e-5), 5e-4);
    const b = this.bullet;
    if (b.x < this.xOut + 0.05) {
      if (b.x < this.xIn - 0.03) dt = Math.min(dt, Math.max(((this.xIn - 0.03) - b.x) / b.v, 1e-6) + 1e-7, 2e-4);
      else dt = Math.min(dt, 0.6 * this.s / b.v);
    }
    return dt;
  }

  // keep particles in Morton (Z-curve) order of their cells so that neighbours are close in
  // memory: the pair loops then run from cache instead of chasing random indices
  reorder() {
    const { N } = this, inv = 1 / this.h;
    const keys = this._keys || (this._keys = new Float64Array(N));
    const spread = (v) => { v &= 1023; v = (v | (v << 16)) & 0x030000FF; v = (v | (v << 8)) & 0x0300F00F; v = (v | (v << 4)) & 0x030C30C3; v = (v | (v << 2)) & 0x09249249; return v; };
    for (let i = 0; i < N; i++) {
      if (!this.alive[i]) { keys[i] = 2 ** 40 * 2 + i; continue; }
      const cx = Math.floor(this.pos[i * 3] * inv) + 512, cy = Math.floor(this.pos[i * 3 + 1] * inv) + 512, cz = Math.floor(this.pos[i * 3 + 2] * inv) + 512;
      keys[i] = (spread(cx) | (spread(cy) << 1) | (spread(cz) << 2)) * 16384 + i;
      if (keys[i] < 0) keys[i] += 2 ** 30 * 16384;
    }
    keys.sort();
    const perm = this._perm || (this._perm = new Int32Array(N));
    for (let k = 0; k < N; k++) perm[k] = keys[k] % 16384;
    const tmp3 = this._tmp3 || (this._tmp3 = new Float32Array(N * 3)), tmp1 = this._tmp1 || (this._tmp1 = new Float32Array(N));
    for (const name of ['pos', 'prev', 'vel']) {
      const a = this[name];
      for (let k = 0; k < N; k++) { const i = perm[k]; tmp3[k * 3] = a[i * 3]; tmp3[k * 3 + 1] = a[i * 3 + 1]; tmp3[k * 3 + 2] = a[i * 3 + 2]; }
      a.set(tmp3);
    }
    for (const name of ['nbSmooth', 'groundT', 'foam']) {
      const a = this[name];
      for (let k = 0; k < N; k++) tmp1[k] = a[perm[k]];
      a.set(tmp1);
    }
    for (const name of ['alive', 'nb']) {
      const a = this[name], c = a.slice();
      for (let k = 0; k < N; k++) a[k] = c[perm[k]];
    }
    this.pairsDirty = true;
  }

  step(dt) {
    if (((this.steps || 0) % 25) === 0 && this.N <= 16384) this.reorder();
    const p = this.p, b = this.bullet, m = this.mem;
    const { N, pos, prev, vel, alive, nb, nbSmooth } = this;
    const g = p.gravity;

    // bullet
    const xa = b.x;
    b.x += b.v * dt;
    if (m.tIn < 0 && b.x >= this.xIn) m.tIn = this.t + dt * ((this.xIn - xa) / (b.x - xa));
    if (m.tOut < 0 && b.x >= this.xOut) m.tOut = this.t + dt * ((this.xOut - xa) / (b.x - xa));
    this.applyBullet(xa, b.x);

    // membrane tear kinematics (latex retraction ~ tens of m/s)

  // advance to physical time T with a step budget; returns true when reached
  advanceTo(T, maxSteps) {

  float cbx = x-ra - f*rba; float cby = paba - f;
  float s = (cbx < 0.0 && cay < 0.0) ? -1.0 : 1.0;
  return s*sqrt(min(cax*cax + cay*cay*baba, cbx*cbx + cby*cby*baba));
}
float sdKnot(vec3 p){
  vec3 kb = knotBase();
  float s = uMemR / 0.08;
  // neck: a trumpet that flares smoothly into the skin (the balloon's teardrop top)
  float yy = (p.y - kb.y) / s;
  float rr = 0.0036 + 0.024*exp(-(yy + 0.006)/0.0045);
  float d = max(length(p.xz - kb.xz)/s - rr, max(-0.004 - yy, yy - 0.017)) * s * 0.55;
  vec3 q = p - (kb + vec3(0.0, 0.022, 0.0)*s);
  d = min(d, length(q*vec3(1.0,1.25,1.0)) - 0.0065*s + 0.0008*s*vnoise(q*500.0/s));
  if (uRemnant > 0.0){
    // torn rubber skirt left on the neck: a thin flared shell with a ragged lower edge
    float L = 0.024*s*uRemnant;
    vec3 top = kb + vec3(0.0, 0.002*s, 0.0), bot = kb - vec3(0.0, L, 0.0);
    vec3 q2 = p - kb;
    float ang = atan(q2.z, q2.x);
    float wob = (vnoise(vec3(cos(ang)*3.0, sin(ang)*3.0, 1.7)) - 0.5);
    float sh = abs(sdCappedCone(p + vec3(wob*0.004*s, 0.0, 0.0), bot, top, 0.012*s*(0.8 + 0.5*wob), 0.0055*s)) - 0.0007*s;
    float edge = (kb.y - L*(0.55 + 0.9*vnoise(vec3(cos(ang)*5.0, sin(ang)*5.0, 3.1)))) - p.y;
    d = min(d, max(sh, edge) * 0.8);
  }
  return d;
}
float knotHit(vec3 ro, vec3 rd, float tmax){
  vec3 c = knotBase() + vec3(0.0, 0.01, 0.0)*(uMemR/0.08);
  float br = 0.045*(uMemR/0.08);
  vec3 oc = ro - c; float b = dot(oc, rd); float h = b*b - dot(oc,oc) + br*br;
  if (h < 0.0) return -1.0;
  h = sqrt(h);
  float t = max(-b - h, 0.0), te = min(-b + h, tmax);
  for (int i = 0; i < 64; i++){
    if (t > te) return -1.0;
    float d = sdKnot(ro + rd*t);
    if (d < 0.00012) return t;
    t += d;
  }
  return -1.0;
}
vec3 knotN(vec3 p){
  vec2 e = vec2(0.0002, 0.0);
  return normalize(vec3(sdKnot(p+e.xyy)-sdKnot(p-e.xyy), sdKnot(p+e.yxy)-sdKnot(p-e.yxy), sdKnot(p+e.yyx)-sdKnot(p-e.yyx)));
}

// ---------------- string ----------------
float stringHit(vec3 ro, vec3 rd, float tmax, float r){
  vec3 kb = knotBase() + vec3(0.0, 0.026*(uMemR/0.08), 0.0);
  vec2 o = ro.xz - kb.xz, d = rd.xz;
  float a = dot(d,d), b = dot(o,d), c = dot(o,o) - r*r;
  float h = b*b - a*c;
  if (h < 0.0 || a < 1e-8) return -1.0;
  float t = (-b - sqrt(h))/a;
  if (t < 0.0 || t > tmax) return -1.0;
  float y = ro.y + rd.y*t;
  if (y < kb.y || y > uStringTop) return -1.0;
  return t;
}

// ---------------- bullet: jacketed round-nose / spitzer profile ----------------
float sdBullet(vec3 p){
  vec3 q = p - uBulletTip;           // x axis = flight direction, tip at origin
  float u = -q.x;                    // distance back from the tip
  float r = length(q.yz);
  float L = uBulletLen, R = uBulletR, nose = L*0.42;
  float prof;
  if (u < nose){ float t = 1.0 - u/nose; prof = R*sqrt(max(0.0, 1.0 - t*t*t)); }
  else prof = R * (1.0 - 0.08*smoothstep(L*0.85, L, u));
  float d = (r - prof) * 0.7;
  d = max(d, -u);
  d = max(d, u - L);
  return d;
}
float bulletHit(vec3 ro, vec3 rd, float tmax){
  if (uBulletOn < 0.5) return -1.0;
  vec3 c = uBulletTip - vec3(uBulletLen*0.5, 0.0, 0.0);
  float br = uBulletLen*0.6;
  vec3 oc = ro - c; float b = dot(oc, rd); float h = b*b - dot(oc,oc) + br*br;
  if (h < 0.0) return -1.0;
  h = sqrt(h);
  float t = max(-b - h, 0.0), te = min(-b + h, tmax);
  for (int i = 0; i < 80; i++){
    if (t > te) return -1.0;
    float d = sdBullet(ro + rd*t);
    if (d < 0.00004) return t;
    t += max(d, 0.00003);
  }
  return -1.0;
}
vec3 bulletN(vec3 p){
  vec2 e = vec2(0.00006, 0.0);
  return normalize(vec3(sdBullet(p+e.xyy)-sdBullet(p-e.xyy), sdBullet(p+e.yxy)-sdBullet(p-e.yxy), sdBullet(p+e.yyx)-sdBullet(p-e.yyx)));
}

// ---------------- shadows onto the floor / board ----------------
vec3 shadowAt(vec3 p){
  vec3 s = vec3(1.0);
  // membrane
  if (uMemOn > 0.5){
    vec2 h = ellipsoidHits(p, uL);
    for (int k = 0; k < 2; k++){
      float t = k == 0 ? h.x : h.y;
      if (t > 0.0){ vec3 d = memDirAt(p + uL*t); if (memIntact(d) > 0.0) s *= mix(vec3(1.0), uLatex*0.9 + 0.05, 0.6); }
    }
  }
  // water: dark rim, focused caustic core
  if (uHasWater > 0.5){
    float t = waterEnter(p, uL, 10.0);
    if (t > 0.0){
      vec3 q = p + uL*t;
      vec3 n = waterNs(q, uVoxel*2.5);
      float c = max(dot(n, uL), 0.0);
      s *= 0.38 + 1.1*pow(c, 4.0);
    }
  }
  // knot / rubber
  if (knotHit(p, uL, 10.0) > 0.0) s *= 0.3;
  return s;
}

// shade the static set with shadows (primary rays only)
vec3 shadeFloor(vec3 p, vec3 rd){
  vec3 a = floorAlbedo(p.xz);
  float w = wetAt(p.xz);
  // sharp-edged stain and standing film (a thin film has a crisp contact line, not a soft cloud)
  float nz = vnoise(vec3(p.xz*22.0, 3.0));
  float wet = smoothstep(0.10, 0.17, w + (nz - 0.5)*0.10);
  float film = smoothstep(0.50, 0.62, w + (nz - 0.5)*0.35);
  a *= mix(1.0, 0.5, wet);
  vec3 n = vec3(0,1,0);
  if (film > 0.0 || wet > 0.0){
    // meniscus at the contact line: tilt the normal along the film-thickness gradient
    float e = 2.0*uWetExt/256.0;
    float gx = wetAt(p.xz + vec2(e,0)) - wetAt(p.xz - vec2(e,0));
    float gz = wetAt(p.xz + vec2(0,e)) - wetAt(p.xz - vec2(0,e));
    float edge = film*(1.0 - film)*4.0;
    vec2 g = vec2(gx, gz) * (0.35 + 2.5*edge);
    // faint capillary ripples on the film
    float h0 = vnoise(vec3(p.xz*60.0, 0.0));
    vec2 rip = vec2(vnoise(vec3((p.xz+vec2(0.002,0))*60.0,0.0)) - h0, vnoise(vec3((p.xz+vec2(0,0.002))*60.0,0.0)) - h0) * 0.18 * film;
    n = normalize(vec3(-g.x - rip.x, 1.0, -g.y - rip.y));
  }
  vec3 sh = shadowAt(p);
  float k = max(dot(n, uL), 0.0) * uLInt * 2.6;
  vec3 col = a * (vec3(1.0,0.97,0.93)*k*sh + vec3(0.85,0.9,1.0)*max(dot(n,uFillDir),0.0)*0.35 + ambientAt(n));
  // wet concrete is glossy; the standing film is a clean mirror
  float F = schlick(max(dot(-rd, n), 0.0), 0.02);
  float refl = mix(0.35*wet, 1.0, film);
  vec3 r = reflect(rd, n);
  col += refl * F * envRadiance(p + n*0.001, r, mix(0.3, 0.0, film)) * (0.5 + 0.5*sh);
  // sharp key-light glint on the film
  col += film * pow(max(dot(r, uL), 0.0), 900.0) * uLInt * 40.0 * sh;
  // dry concrete sheen
  col += (1.0-wet) * 0.012 * pow(max(dot(r, uL), 0.0), 8.0) * uLInt;
  return col * stageFalloff(p);
}
vec3 shadeBoard(vec3 p, float fw){
  vec3 n = vec3(0,0,1);
  vec3 sh = shadowAt(p);
  float k = max(dot(n, uL), 0.0) * uLInt * 2.6;
  return boardAlbedo(p.xy, fw) * ((vec3(1.0,0.97,0.93)*k*sh + vec3(0.85,0.9,1.0)*max(dot(n,uFillDir),0.0)*0.35)*0.8 + ambientAt(n)) * (0.55 + 0.45*stageFalloff(p));
}

void main(){
  vec2 ndc = vUv*2.0 - 1.0;
  vec3 ro = uCamPos;
  vec3 rd = normalize(uCamFwd + ndc.x*uTanHalf*uAspect*uCamRight + ndc.y*uTanHalf*uCamUp);
  vec3 col = vec3(0.0), thr = vec3(1.0);
  float depth = 1.0; bool first = true;
  bool done = false; bool skipW = false; bool fromSkin = false;
  gPixA = uPixA; gPath = 0.0;
  for (int bounce = 0; bounce < 8 && !done; bounce++){
    float tMax = 1e6;
    // candidate surfaces
    float tFloor = rd.y < -1e-5 ? -ro.y/rd.y : -1.0;
    float tBoard = -1.0;
    if (rd.z < -1e-5){ float t = (BOARD_Z - ro.z)/rd.z; vec3 p = ro + rd*t; if (t > 0.0 && abs(p.x - uFocus.x) < 1.7 && p.y > 0.0 && p.y < 2.3) tBoard = t; }
    float tEnv = 1e6;
    if (tFloor > 0.0) tEnv = min(tEnv, tFloor);
    if (tBoard > 0.0) tEnv = min(tEnv, tBoard);

    int kind = 0; float tHit = tEnv;
    if (tFloor > 0.0 && tFloor <= tEnv) kind = 1;
    if (tBoard > 0.0 && tBoard <= tEnv) kind = 2;
    float tb = bulletHit(ro, rd, tHit); if (tb > 0.0 && tb < tHit){ tHit = tb; kind = 3; }
    float tk = knotHit(ro, rd, tHit); if (tk > 0.0 && tk < tHit){ tHit = tk; kind = 4; }
    // string: analytic pixel coverage of a thin vertical cylinder (no aliasing)
    {
      vec3 kb = knotBase() + vec3(0.0, 0.026*(uMemR/0.08), 0.0);
      vec2 o2 = ro.xz - kb.xz, d2 = rd.xz;
      float dd = dot(d2, d2);
      if (dd > 1e-8){
        float ts = -dot(o2, d2) / dd;
        float ys = ro.y + rd.y*ts;
        if (ts > 0.0 && ts < tHit && ys > kb.y && ys < uStringTop){
          float dist = length(o2 + d2*ts);
          float fw = gPixA*(gPath + ts);
          float rS = 0.0007;
          float cov = clamp((rS + 0.5*fw - dist) / fw, 0.0, 1.0) * min(1.0, 2.0*rS/fw);
          if (cov > 0.0){
            vec3 ns = normalize(vec3(o2.x + d2.x*ts, 0.0, o2.y + d2.y*ts) - vec3(rd.x, 0.0, rd.z)*0.5*rS);
            vec3 cs = vec3(0.72,0.70,0.66) * (lightDiffuse(ns)*0.8 + ambientAt(ns) + 0.25);
            col += thr * cs * cov; thr *= 1.0 - cov;
          }
        }
      }
    }
    // membrane: nearest intact shell crossing
    float tm = -1.0; float edge = 0.0;
    if (uMemOn > 0.5 && uDbg != 1 && uDbg != 2){
      vec2 h = ellipsoidHits(ro, rd);
      for (int k = 0; k < 2; k++){
        float t = k == 0 ? h.x : h.y;
        if (t > 1e-5 && t < tHit){ float m = memIntact(memDirAt(ro + rd*t)); if (m > 0.0){ tm = t; edge = m; break; } }
      }
      if (tm > 0.0){ tHit = tm; kind = 5; }
    }
    float tw = skipW ? -1.0 : waterEnter(ro, rd, tHit);
    // just passed inward through the rubber into water that fills it: the water surface is the skin
    if (fromSkin && !skipW && uHasWater > 0.5 && (dens(ro) > uIso*0.8 || dens(ro + rd*0.012) > uIso)) tw = 1e-5;
    fromSkin = false;
    skipW = false;
    if (tw > 0.0 && tw < tHit){
      // water bulging through an intact rubber skin is not possible: the skin is the boundary
      vec3 pw = ro + rd*tw;
      bool clipped = uMemOn > 0.5 && memEl(pw) > 1.001 && memIntact(memDirAt(pw)) > 0.0;
      if (!clipped){ tHit = tw; kind = 7; }
    }

    vec3 p = ro + rd*tHit;
    gPath += tHit;
    if (first && kind != 0){ vec4 cl = uViewProj*vec4(p,1.0); depth = clamp(cl.z/cl.w*0.5+0.5, 0.0, 1.0); first = false; }

    if (kind == 0){ col += thr * envRadiance(ro, rd, 0.0); done = true; }
    else if (kind == 1){
      // area-light reflections are visible when looking at the floor through the scene
      col += thr * shadeFloor(p, rd); done = true;
    }
    else if (kind == 2){ col += thr * shadeBoard(p, gPixA*gPath); done = true; }
    else if (kind == 3){
      vec3 n = bulletN(p);
      vec3 F0 = vec3(0.96, 0.64, 0.50);
      float c = max(dot(-rd, n), 0.0);
      vec3 F = F0 + (1.0-F0)*pow(1.0-c, 5.0);
      vec3 r = reflect(rd, n);
      vec3 e = envRadiance(p + n*1e-4, r, 0.22);
      col += thr * (F * e + F0 * 0.04 * lightDiffuse(n));
      done = true;
    }
    else if (kind == 4 || kind == 6){
      vec3 n = kind == 4 ? knotN(p) : normalize(vec3(p.x - knotBase().x, 0.0, p.z - knotBase().z));
      vec3 alb = kind == 4 ? uLatex*0.75 : vec3(0.72,0.70,0.66);
      float c = max(dot(-rd, n), 0.0);
      float F = schlick(c, 0.045);
      vec3 sh = vec3(1.0);
      vec3 cc = alb * (lightDiffuse(n)*sh + ambientAt(n)) * (1.0-F) + F * (kind == 6 ? 0.0 : 1.0) * envRadiance(p + n*1e-4, reflect(rd, n), 0.25);
      col += thr * cc; done = true;
    }
    else if (kind == 5){
      vec3 n = memNormalAt(p);
      vec3 d = memDirAt(p);
      if (dot(n, rd) > 0.0) n = -n;
      float rim = 1.0 - smoothstep(0.0, 0.07, edge);          // rolled-up rubber at the tear edge
      float thick = mix(0.6, 1.0, smoothstep(0.55, 1.0, d.y)); // thicker towards the neck
      float a = clamp(0.42*thick + 0.5*rim, 0.0, 0.96);
      float c = max(dot(-rd, n), 0.0);
      float F = schlick(c, 0.045);
      vec3 spec = F * envRadiance(p + n*1e-4, reflect(rd, n), 0.12);
      vec3 diff = uLatex * (lightDiffuse(n) + ambientAt(n)) * a;
      vec3 back = uLatex * max(dot(rd, uL), 0.0) * uLInt * 0.9 * (1.0 - a*0.5);   // light through the rubber
      col += thr * (spec + diff*0.9 + back*0.35);
      thr *= (1.0 - F) * mix(vec3(1.0), uLatex*1.05, clamp(a*1.6, 0.0, 1.0)) * (1.0 - a*0.55);
      fromSkin = dot(rd, memNormalAt(p)) < 0.0;
      ro = p + rd*2e-4;
    }
    else if (kind == 7 && uDbg == 2){ col = waterN(p)*0.5+0.5; col*=col; done = true; }
    else if (kind == 7){
      // water surface: reflect (single bounce to environment) + refract through the volume
      vec3 n = waterN(p);
      if (uMemOn > 0.5){
        float el = memEl(p);
        if (el > 0.9 && memIntact(memDirAt(p)) > 0.0) n = normalize(mix(n, memNormalAt(p), smoothstep(0.9, 0.975, el)));
      }
      // capillary ripples riding on the free surface (left by the retracting rubber and the shot),
      // in a frame that moves with the water so they do not swim over the surface
      if (uRip > 0.0){
        vec3 q4 = (p - uBlobC)*190.0;
        float h1 = vnoise(q4);
        vec3 g1 = vec3(vnoise(q4 + vec3(0.3,0,0)) - h1, vnoise(q4 + vec3(0,0.3,0)) - h1, vnoise(q4 + vec3(0,0,0.3)) - h1);
        n = normalize(n + g1 * uRip);
      }
      // splashing water on the floor is covered in capillary ripples and impact roughness
      float fl = 1.0 - smoothstep(0.012, 0.05, p.y);
      if (fl > 0.0){
        vec3 q3 = p*140.0;
        float h0 = vnoise(q3);
        vec3 gr = vec3(vnoise(q3 + vec3(0.35,0,0)) - h0, vnoise(q3 + vec3(0,0.35,0)) - h0, vnoise(q3 + vec3(0,0,0.35)) - h0);
        n = normalize(n + gr * 1.6 * fl);
      }
      if (dot(n, rd) > 0.0) n = -n;
      float c = max(dot(-rd, n), 0.0);
      float F = schlick(c, 0.02);
      col += thr * F * envRadiance(p + n*2e-4, reflect(rd, n), 0.0);
      thr *= (1.0 - F);
      vec3 dIn = refract(rd, n, 1.0/1.333);
      vec3 q = p - n*uVoxel*0.35;
      vec3 dcur = dIn;
      float travelled = 0.0, foamPath = 0.0;
      bool escaped = false;
      // bubbly water: a whitish, scattering layer at the surface
      float fS = foamAt(p);
      if (fS > 0.02){
        vec3 lit = lightDiffuse(n)*0.6 + ambientAt(n) + vec3(0.12);
        float cover = clamp(fS*0.35, 0.0, 0.4);
        col += thr * cover * lit * vec3(0.92, 0.95, 0.97);
        thr *= 1.0 - cover;
      }
      for (int k = 0; k < 3; k++){
        // the bullet can be seen through the water
        float te = waterExit(q, dcur);
        foamPath += (foamAt(q + dcur*te*0.25) + foamAt(q + dcur*te*0.75)) * 0.5 * te;
        float tb2 = bulletHit(q, dcur, te);
        if (tb2 > 0.0){
          vec3 bp = q + dcur*tb2; vec3 bn = bulletN(bp);
          vec3 F0 = vec3(0.96,0.64,0.50);
          col += thr * F0 * envRadiance(bp + bn*1e-4, reflect(dcur, bn), 0.25) * exp(-travelled*vec3(0.4,0.07,0.03));
          done = true; escaped = true; break;
        }
        bool onSkin = false;
        if (uMemOn > 0.5){
          vec2 hm = ellipsoidHits(q, dcur);
          float tx = hm.y;
          if (tx > 0.0){
            vec3 pe = q + dcur*tx;
            if ((tx < te || memEl(q + dcur*te) > 0.93) && memIntact(memDirAt(pe)) > 0.0){ te = tx; onSkin = true; }
          }
        }
        if (dcur.y < -1e-4){
          float tf = -q.y / dcur.y;
          if (tf > 0.0 && tf < te){
            travelled += tf;
            vec3 fp = q + dcur*tf;
            // wet concrete under the water, lit through the water surface: light focused by the
            // curved surface above forms caustics (brighter where the surface converges the light)
            vec3 a = floorAlbedo(fp.xz) * 0.6;
            vec3 tr0 = exp(-travelled * vec3(0.45, 0.07, 0.03));
            vec3 sn = waterNs(fp + vec3(0.0, 0.5*uVoxel, 0.0), uVoxel*1.5);
            float caus = 0.75 + 1.1*pow(clamp(dot(sn, uL), 0.0, 1.0), 6.0);
            col += thr * tr0 * a * (lightDiffuse(vec3(0,1,0))*caus + ambientAt(vec3(0,1,0))) * stageFalloff(fp);
            done = true; escaped = true; break;
          }
        }
        travelled += te;
        vec3 e = q + dcur*te;
        vec3 no = onSkin ? memNormalAt(e) : waterN(e);
        if (dot(no, dcur) < 0.0) no = -no;
        vec3 dOut = refract(dcur, -no, 1.333);
        if (dot(dOut, dOut) < 1e-6){ dcur = reflect(dcur, -no); q = e - no*uVoxel*0.35; continue; }
        float Fo = schlick(max(dot(dcur, no), 0.0), 0.02);
        rd = dOut;
        if (onSkin){ ro = e - no*1e-4; skipW = true; } else ro = e + no*uVoxel*0.6;
        thr *= (1.0 - Fo);
        escaped = true; break;
      }
      gPixA *= 4.0; gPath += travelled;
      // Beer-Lambert absorption + aeration (micro-bubbles whiten the water after the hit)
      float optical = travelled*uAerate*10.0 + foamPath*22.0;       // bubble scattering
      vec3 tr = exp(-travelled * vec3(0.45, 0.07, 0.03)) * exp(-optical);
      vec3 inscat = (1.0 - exp(-optical)) * (lightDiffuse(vec3(0,1,0))*0.3 + ambientAt(vec3(0,1,0)) + uLInt*0.2);
      col += thr * inscat * 0.65;
      thr *= tr;
      if (!escaped){ col += thr * envRadiance(ro, rd, 0.3) * 0.5; done = true; }
      if (uDbg == 7 && escaped && !done){ col = rd*0.5+0.5; done = true; }
      if (uDbg == 6){ col = escaped ? vec3(0.0, travelled*5.0, 0.0) : vec3(1.0,0.0,0.0); done = true; }
    }
    if (max(thr.r, max(thr.g, thr.b)) < 0.01) done = true;
  }
  outColor = vec4(col, 1.0);
  gl_FragDepth = depth;
}
`;

const FULL_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const SPRITE_VS = `#version 300 es
precision highp float;
in vec2 aCorner;
in vec4 aPS;      // xyz, radius
in vec4 aInfo;    // type, alpha, age, spare
uniform mat4 uViewProj; uniform vec3 uCamRight, uCamUp, uCamPos;
uniform float uPixelWorld; // world size of one pixel at distance 1
out vec2 vC; out vec4 vInfo; out vec3 vWorld; out float vCover;
void main(){
  float dist = length(aPS.xyz - uCamPos);
  float minR = uPixelWorld * dist * 0.9;
  float r = max(aPS.w, minR);
  vCover = clamp((aPS.w*aPS.w)/(r*r), 0.0, 1.0);
  if (aInfo.x > 0.5) { r = aPS.w; vCover = 1.0; }
  vec3 w = aPS.xyz + (aCorner.x*uCamRight + aCorner.y*uCamUp) * r;
  vC = aCorner; vInfo = aInfo; vWorld = w;
  gl_Position = uViewProj * vec4(w, 1.0);

const SPRITE_FS = GLSL_COMMON + `

    p.x = e.clientX; p.y = e.clientY;
    if (dragMode === 'pinch' && pointers.size === 2) {
      const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastPinch > 0) cam.dist = Math.min(6, Math.max(0.12, cam.dist * (lastPinch / d)));
      lastPinch = d;
    } else if (dragMode === 'orbit') {
      cam.yaw -= dx * 0.006; cam.pitch = Math.min(1.5, Math.max(-0.35, cam.pitch + dy * 0.005));
    } else if (dragMode === 'pan') {
      const c = camera(canvas.width, canvas.height);
      const k = cam.dist * 0.0016;
      for (let a = 0; a < 3; a++) camTarget[a] += (-dx * c.right[a] + dy * c.up[a]) * k;
      S.follow = false; $('follow').checked = false;
    }
    dirty = true;
  });
  const endPtr = (e) => { pointers.delete(e.pointerId); if (pointers.size === 0) { dragMode = null; canvas.classList.remove('dragging'); } else if (pointers.size === 1) dragMode = 'orbit'; };
  canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.min(6, Math.max(0.12, cam.dist * Math.exp(e.deltaY * 0.0012))); dirty = true; }, { passive: false });
  canvas.addEventListener('dblclick', () => { setView('home'); S.follow = true; $('follow').checked = true; });

  // ---------------------------------------------------------------- controls
  const physIds = ['speed', 'caliber', 'offset', 'energy', 'radius', 'height', 'snap', 'gravity', 'cavity', 'mist', 'count'];
  let restartTimer = null;
  function bind(id, apply, isPhys) {
    const el = $(id), out = $(id + 'O');
    const show = () => { out.textContent = fmt[id](el.value); };
    show();
    el.addEventListener('input', () => {
      show(); apply(+el.value);
      if (isPhys) { clearTimeout(restartTimer); restartTimer = setTimeout(() => { restart(); setPlaying(true); }, 220); }
      dirty = true;
    });
  }
  for (const id of physIds) bind(id, (v) => { P[id] = v; }, true);
  bind('laz', (v) => (L.az = v)); bind('lel', (v) => (L.el = v)); bind('lint', (v) => (L.I = v));
  bind('expo', (v) => (L.exposure = v)); bind('scale', (v) => (L.scale = v));
  bind('slow', (v) => (S.slowLog = v));
  $('ramp').addEventListener('change', (e) => (S.ramp = e.target.checked));
  $('follow').addEventListener('change', (e) => { S.follow = e.target.checked; dirty = true; });
  const sw = $('swatches');
  for (const k of Object.keys(LATEX)) {
    const b = document.createElement('button');
    b.className = 'swatch'; b.setAttribute('aria-label', k[0].toUpperCase() + k.slice(1)); b.setAttribute('aria-pressed', k === L.color);
    const c = LATEX[k].map((v) => Math.round(Math.pow(Math.min(1, v * 1.35), 1 / 2.2) * 255));
    b.style.background = `rgb(${c})`;
    b.addEventListener('click', () => { L.color = k; for (const x of sw.children) x.setAttribute('aria-pressed', x === b); dirty = true; });
    sw.appendChild(b);
  }
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  function setPlaying(on) {
    S.playing = on;
    $('playText').textContent = on ? 'Pause' : 'Play';
    $('play').setAttribute('aria-label', on ? 'Pause' : 'Play');
    $('playIcon').innerHTML = on ? '<rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/>' : '<path d="M4 2l10 6-10 6z"/>';
  }
  $('play').addEventListener('click', () => { if (!S.playing && sim.t >= tEnd - 1e-6) restart(); setPlaying(!S.playing); });
  $('restart').addEventListener('click', () => { restart(); setPlaying(true); });
  $('step').addEventListener('click', () => { setPlaying(false); seek(sim.t + rate() / 30); });
  const scrub = $('scrub');
  const K = 6;
  const u2t = (u) => (tEnd * (Math.exp(K * u) - 1)) / (Math.exp(K) - 1);
  const t2u = (t) => Math.log(1 + (t / tEnd) * (Math.exp(K) - 1)) / K;
  scrub.addEventListener('input', () => { setPlaying(false); seek(u2t(scrub.value / 1000)); });
  $('settingsBtn').addEventListener('click', () => { const o = $('panel').classList.toggle('open'); $('settingsBtn').setAttribute('aria-expanded', o); });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
    else if (e.code === 'ArrowRight' && e.target.type !== 'range') { e.preventDefault(); $('step').click(); }
    else if (e.key === 'r' || e.key === 'R') { restart(); setPlaying(true); }
  });

  // ---------------------------------------------------------------- frame loop
  let dirty = true, lastVersion = -1, lastNow = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    const w = Math.max(2, Math.round(r.width * dpr)), h = Math.max(2, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; dirty = true; }
  }
  function phaseText() {
    const m = sim.mem, a = sim.t - sim.tImpact;
    if (a < 0) return 'Bullet approaching';
    if (m.tOut < 0) return 'Bullet passing through the water';
    if (!m.gone) return 'Rubber tearing away from the holes';
    const grid = R.grid;
    if (a < 0.04) return 'Water hangs in the air, cavity collapsing';
    if (sim.vmaxBulk > 0.4 && grid.has && grid.center && grid.center[1] > 0.06) return 'Falling';
    return 'Splashing onto the floor';
  }
  function updateHud() {
    const a = (sim.t - sim.tImpact) * 1000;
    const sign = a < 0 ? '−' : '+';
    const digits = Math.abs(a) < 10 ? 3 : Math.abs(a) < 100 ? 2 : 1;
    $('clock').innerHTML = `${sign}${Math.abs(a).toFixed(digits)}<small>ms</small>`;
    const r = rate();
    $('rate').textContent = S.playing ? `${Math.round(1 / r).toLocaleString()}× slower than real time` : 'Paused';
    $('phase').textContent = phaseText();
    if (document.activeElement !== scrub) scrub.value = Math.round(t2u(sim.t) * 1000);
    let alive = 0; for (let i = 0; i < sim.N; i++) alive += sim.alive[i];
    $('stats').textContent = `${alive} water parcels, ${sim.fx.n} spray and mist particles, ${fps.toFixed(0)} fps`;
  }
  function frame(now) {
    const dtReal = Math.min(0.05, (now - lastNow) / 1000);
    lastNow = now;
    resize();
    let busy = false;
    if (seekT !== null) {
      if (stepTo(seekT, 34)) seekT = null; else busy = true;
    } else if (S.playing) {
      stepTo(Math.min(tEnd, sim.t + rate() * dtReal), 26);
      if (sim.t >= tEnd - 1e-6) setPlaying(false);
    }
    $('busy').style.display = busy ? 'block' : 'none';
    if (sim.version !== lastVersion) {
      R.buildVolume(sim); R.buildSprites(sim); lastVersion = sim.version; dirty = true;
    }
    // follow the bulk of the water
    if (S.follow && R.grid.has && R.grid.center && sim.t > sim.tImpact) {
      const k = seekT !== null || !S.playing ? 1 : Math.min(1, dtReal * 2.5);
      const tgt = [R.grid.center[0], S.floorCam ? 0.16 : Math.max(R.grid.center[1], 0.1), R.grid.center[2]];
      for (let a = 0; a < 3; a++) { const d = tgt[a] - camTarget[a]; if (Math.abs(d) > 1e-5) { camTarget[a] += d * k; dirty = true; } }
    } else if (S.follow && sim.t <= sim.tImpact) {
      for (let a = 0; a < 3; a++) camTarget[a] = sim.C[a];
      if (S.floorCam) camTarget[1] = 0.16;
    }
    if (dirty) {
      const c = camera(canvas.width, canvas.height);
      const after = sim.t - sim.tImpact;
      const aerate = after > 0 ? 0.03 * Math.min(1, after / 0.002) * Math.exp(-after / 0.25) * Math.min(2, P.energy * P.speed / 360) : 0;
      R.render(sim, { cam: c, light: lighting(), exposure: L.exposure, latex: LATEX[L.color], focus: sim.C, aerate }, L.scale);
      dirty = false;
      fpsAcc += dtReal; fpsN++;
      if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
    }
    updateHud();
    if (!halted) requestAnimationFrame(frame);
  }
  let halted = false;

  // ---------------------------------------------------------------- test hooks (headless review)
  window.WB = {
    seekMs(ms) { setPlaying(false); seek(sim.tImpact + ms / 1000); return new Promise((res) => { const w = () => (seekT === null ? res(sim.t) : requestAnimationFrame(w)); w(); }); },
    view(v, extra) { setView(v); if (extra) Object.assign(cam, extra); dirty = true; },
    set(k, v) { if (k in P) { P[k] = v; restart(); setPlaying(false); } else if (k in L) L[k] = v; dirty = true; },
    follow(on) { S.follow = on; },
    halt() { halted = true; },
    // synchronous: reach time, build, render (for headless review)
    shot(ms) {
      setPlaying(false);
      seek(sim.tImpact + ms / 1000);
      while (!stepTo(seekT, 1e9)) {}
      seekT = null;
      R.buildVolume(sim); R.buildSprites(sim); lastVersion = sim.version;
      if (S.follow && R.grid.has && sim.t > sim.tImpact) camTarget = [R.grid.center[0], S.floorCam ? 0.16 : Math.max(R.grid.center[1], 0.1), R.grid.center[2]];
      else if (S.follow) { camTarget = sim.C.slice(); if (S.floorCam) camTarget[1] = 0.16; }
      dirty = true; lastNow = performance.now(); frame(performance.now());
      const t0 = performance.now(); R.gl.finish(); return performance.now() - t0;
    },
    get sim() { return sim; }, get R() { return R; }, cam, camTarget: () => camTarget,
  };

  restart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
